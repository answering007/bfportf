[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bfportf"
dynamic = ["version"]
description = "Find equity portfolios by a target metric (greedy, beam and exhaustive search)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["portfolio", "optimization", "sharpe", "drawdown", "quant", "trading", "backtesting"]
authors = [
  { name = "answering007", email = "answering007@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
	"numpy>=1.22",
	"pandas>=1.5",
	"scipy>=1.8",
	"tqdm>=4.64",
]

[project.urls]
Documentation = "https://github.com/answering007/bfportf#readme"
Issues = "https://github.com/answering007/bfportf/issues"
Source = "https://github.com/answering007/bfportf"

[project.optional-dependencies]
examples = [
  "jupyter>=1.0",
  "quantstats>=0.0.62",
  "scikit-learn>=1.3",
]

[tool.hatch.version]
path = "src/bfportf/__about__.py"

[dependency-groups]
dev = [
  "coverage[toml]>=6.5",
  "mypy>=1.8.0",
  "nbstripout>=0.7",
  "pandas-stubs>=2.0",
  "pre-commit>=3.6",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6.0",
  "types-tqdm>=4.66",
]

[tool.mypy]
# mypy 2.x does not support Python 3.9 as a target, the package itself still supports 3.9
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# scipy-stubs requires Python 3.10.1+, the package still supports 3.9
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120
# Example notebooks are pedagogical material (intentional import order, print, long URLs)
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  # Public API keeps boolean positional flags (`maximize`, `absolute`);
  # keyword-only arguments are scheduled for 0.2.0
  "FBT001", "FBT002",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["bfportf"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["bfportf", "tests"]
branch = true
parallel = true
omit = [
  "src/bfportf/__about__.py",
]

[tool.coverage.paths]
bfportf = ["src/bfportf", "*/bfportf/src/bfportf"]
tests = ["tests", "*/bfportf/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bfportf"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.pre-commit-config.yaml",
  "/examples/*.csv",
  "/plan.md",
  "/uv.lock",
]
